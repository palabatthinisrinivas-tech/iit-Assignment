lang: Telugu
split_json: /kaggle/working/project/Telugu/data_split/Telugu_split.json
preprocess:
  dataset: Telugu
  path:
    corpus_path: /kaggle/temp/work/raw_data/Telugu
    lexicon_path: lexicon/librispeech-lexicon.txt
    raw_path: /kaggle/temp/work/raw_data/Telugu
    preprocessed_path: /kaggle/working/fs2-backup/Telugu/inference_stats
  preprocessing:
    val_size: 525
    text:
      text_cleaners:
      - english_cleaners
      language: te
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: phoneme_level
      normalization: true
    energy:
      feature: phoneme_level
      normalization: true
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: true
  max_seq_len: 1200
  vocoder:
    model: HiFi-GAN
    speaker: universal
train:
  path:
    ckpt_path: /kaggle/working/fs2-backup/Telugu/checkpoints
    log_path: /kaggle/working/fs2-backup/Telugu/logs
    result_path: /kaggle/working/fs2-backup/Telugu/output/result
  optimizer:
    batch_size: 16
    betas:
    - 0.9
    - 0.98
    eps: 1.0e-09
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps:
    - 28000
    - 34000
    anneal_rate: 0.3
  step:
    total_step: 40000
    log_step: 100
    synth_step: 1000000000
    val_step: 1000
    save_step: 10000
